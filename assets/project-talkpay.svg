<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="phoneGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0056b3" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18233c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e90ff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#d50000" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#1e90ff" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bg)" />
  <circle cx="600" cy="400" r="320" fill="url(#phoneGlow)" filter="blur(60px)" />

  <!-- Background decorative grid lines -->
  <g stroke="#1a2744" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
    <line x1="1100" y1="0" x2="1100" y2="800" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Left Stats & Info Box -->
  <g transform="translate(110, 180)">
    <rect width="260" height="96" rx="16" fill="#10192c" stroke="#1f3154" stroke-width="1.5" />
    <text x="24" y="38" fill="#1e90ff" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">GOOGLE PLAY STORE</text>
    <text x="24" y="72" fill="#ffffff" font-family="Anton, sans-serif" font-size="32">500+ INSTALLS</text>

    <rect y="120" width="260" height="96" rx="16" fill="#10192c" stroke="#1f3154" stroke-width="1.5" />
    <text x="24" y="158" fill="#00e676" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ARCHITECTURE</text>
    <text x="24" y="192" fill="#ffffff" font-family="Anton, sans-serif" font-size="28">NATIVE KOTLIN</text>

    <rect y="240" width="260" height="96" rx="16" fill="#10192c" stroke="#1f3154" stroke-width="1.5" />
    <text x="24" y="278" fill="#ff9100" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">TELEPHONY ENGINE</text>
    <text x="24" y="312" fill="#ffffff" font-family="Anton, sans-serif" font-size="28">CALL OVERLAY</text>
  </g>

  <!-- Center Mobile Phone Mockup -->
  <g transform="translate(420, 60)" filter="url(#shadow)">
    <!-- Phone Outer Body -->
    <rect width="360" height="680" rx="44" fill="#090d16" stroke="#253554" stroke-width="3" />
    <!-- Screen Inner Area -->
    <rect x="10" y="10" width="340" height="660" rx="36" fill="#0b1120" />

    <!-- Notch / Dynamic Island -->
    <rect x="125" y="22" width="110" height="26" rx="13" fill="#04060a" />
    <circle cx="215" cy="35" r="4.5" fill="#102035" />

    <!-- Status Bar Icons -->
    <text x="36" y="39" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600">9:41</text>
    <g transform="translate(285, 30)" fill="#94a3b8">
      <path d="M0 8h2v2H0zM3 6h2v4H3zM6 4h2v6H6zM9 1h2v9H9z" />
    </g>

    <!-- App Header -->
    <g transform="translate(24, 70)">
      <rect width="32" height="32" rx="8" fill="url(#blueAccent)" />
      <path d="M11 11h10M11 16h6M11 21h10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="44" y="22" fill="#ffffff" font-family="Inter, sans-serif" font-size="17" font-weight="800" letter-spacing="0.5">TalkPay</text>
      <text x="245" y="21" fill="#1e90ff" font-family="Inter, sans-serif" font-size="11" font-weight="700">ACTIVE</text>
      <circle cx="237" cy="18" r="4" fill="#00e676" />
    </g>

    <!-- Main Incoming Caller Card -->
    <g transform="translate(20, 125)">
      <rect width="300" height="340" rx="24" fill="url(#cardGrad)" stroke="#22365c" stroke-width="1.5" />
      
      <!-- Caller Avatar with Verified Badge -->
      <circle cx="150" cy="80" r="44" fill="#132344" stroke="#1e90ff" stroke-width="2.5" />
      <path d="M150 56a16 16 0 1 0 0 32 16 16 0 0 0 0-32zm0 40c-18 0-32 12-32 20h64c0-8-14-20-32-20z" fill="#93c5fd" />
      <circle cx="180" cy="108" r="12" fill="#00e676" stroke="#0b1120" stroke-width="2.5" />
      <path d="M176 108l3 3 5-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Caller Name & Status -->
      <text x="150" y="156" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="700">David Sterling</text>
      <text x="150" y="178" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="600">Enterprise Tech Lead</text>
      <text x="150" y="202" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" letter-spacing="1">+91 98402 11928</text>

      <!-- Trust & Spam Shield Pill -->
      <rect x="50" y="222" width="200" height="32" rx="16" fill="#0c1e38" stroke="#1d4ed8" stroke-width="1" />
      <text x="150" y="243" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700">✓ 100% IDENTIFIED · NO SPAM</text>

      <!-- Call Action Buttons -->
      <g transform="translate(45, 274)">
        <!-- Decline Button -->
        <circle cx="34" cy="24" r="24" fill="url(#redGrad)" />
        <path d="M26 24h16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

        <!-- Accept Button -->
        <circle cx="176" cy="24" r="24" fill="url(#greenGrad)" />
        <path d="M170 20c2 4 6 8 10 10l3-3c1-1 3-1 4 0l3 3c1 1 1 3-1 4-6 2-14-6-16-12-1-2 0-3 2-4l3-3c1-1 3-1 4 0l3 3c1 1 0 3-1 4z" fill="#ffffff" />
      </g>
    </g>

    <!-- Recent Call Log item at bottom of phone -->
    <g transform="translate(20, 485)">
      <rect width="300" height="155" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="26" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1">RECENT CALL ANALYTICS</text>
      
      <line x1="16" y1="40" x2="284" y2="40" stroke="#1e293b" stroke-width="1" />
      
      <circle cx="34" cy="64" r="14" fill="#1e293b" />
      <text x="34" y="68" text-anchor="middle" fill="#93c5fd" font-family="Inter, sans-serif" font-size="10" font-weight="700">IN</text>
      <text x="60" y="62" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="13" font-weight="600">Client Board Call</text>
      <text x="60" y="78" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Duration: 14m 22s · HD Audio</text>
      
      <circle cx="34" cy="112" r="14" fill="#1e293b" />
      <text x="34" y="116" text-anchor="middle" fill="#00e676" font-family="Inter, sans-serif" font-size="10" font-weight="700">OK</text>
      <text x="60" y="110" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="13" font-weight="600">Verified Direct Line</text>
      <text x="60" y="126" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Automated Room DB Cache</text>
    </g>
  </g>

  <!-- Right Highlights Box -->
  <g transform="translate(830, 220)">
    <text x="0" y="0" fill="#1e90ff" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2">KEY FEATURES</text>
    <text x="0" y="32" fill="#ffffff" font-family="Anton, sans-serif" font-size="34">KOTLIN CALLER ID</text>
    <text x="0" y="66" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14" font-weight="400">
      <tspan x="0" dy="0">High-performance native Android dialer</tspan>
      <tspan x="0" dy="24">with background telephony service and</tspan>
      <tspan x="0" dy="24">instant contact resolution.</tspan>
    </text>

    <g transform="translate(0, 130)">
      <rect width="260" height="42" rx="10" fill="#0d1527" stroke="#1d4ed8" stroke-width="1" />
      <text x="16" y="26" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="600">✦ Background Overlay Manager</text>
    </g>
    <g transform="translate(0, 184)">
      <rect width="260" height="42" rx="10" fill="#0d1527" stroke="#1d4ed8" stroke-width="1" />
      <text x="16" y="26" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="600">✦ Room Database Caching</text>
    </g>
    <g transform="translate(0, 238)">
      <rect width="260" height="42" rx="10" fill="#0d1527" stroke="#1d4ed8" stroke-width="1" />
      <text x="16" y="26" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="600">✦ AdMob SDK Integration</text>
    </g>
  </g>
</svg>
